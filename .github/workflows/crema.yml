name: Type check by crema

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

env:
  CREMA_VERSION: v0.3.5

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6.0.2
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ruby
        bundler-cache: true
    - name: Install crema
      working-directory: ${{ runner.temp }}
      run: |
        target="amazonlinux-2023-$(uname -m)"
        curl -fsSLO "https://github.com/ksss/crema/releases/download/${CREMA_VERSION}/crema-${CREMA_VERSION}-${target}.tar.gz"
        curl -fsSLO "https://github.com/ksss/crema/releases/download/${CREMA_VERSION}/checksums.txt"
        sha256sum -c --ignore-missing checksums.txt
        tar -xzf "crema-${CREMA_VERSION}-${target}.tar.gz" crema
        install -m 0755 crema /usr/local/bin/crema
        crema --version
    - name: Install RBS collection
      run: bundle exec rbs collection install
    - name: Check crema diagnostics do not increase
      run: |
        cp crema-check-tamped.jsonl "${RUNNER_TEMP}/before.jsonl"
        bundle exec rake crema:tamping
        added=$(comm -13 "${RUNNER_TEMP}/before.jsonl" crema-check-tamped.jsonl)
        removed=$(comm -23 "${RUNNER_TEMP}/before.jsonl" crema-check-tamped.jsonl)
        if [ -n "$removed" ]; then
          echo "::warning::crema diagnostics resolved. Run 'rake crema:tamping' and commit crema-check-tamped.jsonl to update the baseline."
          echo "$removed"
        fi
        if [ -n "$added" ]; then
          echo "::error::New crema diagnostics found. Fix them, or run 'rake crema:tamping' and commit crema-check-tamped.jsonl."
          echo "$added"
          exit 1
        fi
